<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>1分動画ガチャ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Yusei+Magic&family=Zen+Maru+Gothic:wght@500;700&display=swap" rel="stylesheet">
<style>
/* layout: a candy-shop gacha counter. The capsule and the video share the yellow stage on top; one white sheet at the bottom holds the words and the buttons */
:root{
  color-scheme:light;
  --bg:#ffd23f; --dots:#f5bd1f; --ink:#1d1a2f; --paper:#fffdf5; --muted:#5e5a72;
  --red:#f0412f; --shun:#2f7bff; --ari:#ff5c8a;
  --display:"Dela Gothic One","Hiragino Kaku Gothic StdN","Yu Gothic",sans-serif;
  --body:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;color:var(--ink);font-family:var(--body);font-weight:500;font-size:16px;line-height:1.7;-webkit-text-size-adjust:100%;
  background-color:var(--bg);background-image:radial-gradient(var(--dots) 2.5px,transparent 3px);background-size:22px 22px;overflow:hidden}
.phone{max-width:440px;height:100%;margin:0 auto;display:flex;flex-direction:column}
.phone[data-me="shun"]{--me:var(--shun)} .phone[data-me="ari"]{--me:var(--ari)}
.phone[data-from="shun"]{--from:var(--shun)} .phone[data-from="ari"]{--from:var(--ari)} .phone[data-from="memo0"]{--from:#f2b134} .phone[data-from="memo1"]{--from:#7bc96f} .phone[data-from="memo2"]{--from:#ff8a5c} .phone[data-from="memo3"]{--from:#9b7bea} .phone[data-from="memo4"]{--from:#2ec4b6}

.bar{display:flex;justify-content:space-between;align-items:center;padding:14px 18px 0;font-size:13px;font-weight:700}
.who{display:flex;align-items:center;gap:8px}
.ava{width:30px;height:30px;border-radius:50%;background:var(--me);border:3px solid var(--ink);color:#fff;display:grid;place-items:center;font-family:var(--display);font-size:13px}
.tag{background:var(--paper);border:2.5px solid var(--ink);border-radius:999px;padding:0 10px}

.scene{flex:1;min-height:220px;position:relative;display:grid;place-items:center;padding:12px 18px}
.scene>*{grid-area:1/1}
.floor{align-self:end;width:150px;height:18px;border-radius:50%;background:rgba(29,26,47,.22);margin-bottom:calc(50% - 150px);display:none}

.cap{width:190px;height:190px;border:0;background:none;padding:0;position:relative;cursor:pointer;-webkit-tap-highlight-color:transparent}
.cap span{position:absolute;left:0;width:100%;height:50%;border:4px solid var(--ink);transition:transform .45s cubic-bezier(.3,1.5,.5,1),opacity .35s}
.cap .top{top:0;border-radius:190px 190px 0 0;background:var(--from);border-bottom-width:3px;transform-origin:0 100%}
.cap .bot{bottom:0;border-radius:0 0 190px 190px;background:var(--paper);border-top-width:3px}
.cap .top::after{content:"";position:absolute;left:20px;top:16px;width:34px;height:18px;border-radius:50%;background:rgba(255,255,255,.75);transform:rotate(-28deg)}
.cap.hide{opacity:0;pointer-events:none}
.cap.arrive{animation:arrive .9s cubic-bezier(.2,.9,.3,1) both,wob 2.4s 1s ease-in-out infinite}
.cap.shake{animation:shake .45s linear both}
.cap.open .top{transform:translate(-26px,-74px) rotate(-48deg);opacity:0}
.cap.open .bot{transform:translateY(70px);opacity:0}
.cap.open{pointer-events:none}
.cap.empty .top{background:rgba(255,255,255,.55)}
.cap.empty .bot{background:rgba(255,255,255,.55)}
.cap.pop{animation:pop .4s cubic-bezier(.3,1.6,.5,1) both}
.cap.roll{animation:roll .85s cubic-bezier(.5,0,.8,.4) forwards;pointer-events:none}
@keyframes arrive{from{transform:translateX(-110vw) rotate(-560deg)}70%{transform:translateX(10px) rotate(12deg)}to{transform:none}}
@keyframes wob{0%,60%,100%{transform:translate(var(--lx,0px),var(--ly,0px)) rotate(var(--lr,0deg))}70%{transform:translate(var(--lx,0px),var(--ly,0px)) rotate(calc(var(--lr,0deg) - 9deg))}80%{transform:translate(var(--lx,0px),var(--ly,0px)) rotate(calc(var(--lr,0deg) + 8deg))}90%{transform:translate(var(--lx,0px),var(--ly,0px)) rotate(calc(var(--lr,0deg) - 4deg))}}
@keyframes shake{0%,100%{transform:translateX(0) rotate(0)}15%{transform:translateX(-9px) rotate(-8deg)}30%{transform:translateX(9px) rotate(8deg)}45%{transform:translateX(-8px) rotate(-7deg)}60%{transform:translateX(8px) rotate(7deg)}80%{transform:translateX(-4px) rotate(-3deg) scale(1.08)}}
@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
@keyframes roll{to{transform:translateX(110vw) rotate(560deg)}}

.machine{width:min(74vw,258px);position:relative;transition:transform .45s cubic-bezier(.4,0,.2,1),opacity .3s}
.machine.away{opacity:0;pointer-events:none}
.machine.jig{animation:jig .32s}
@keyframes jig{25%{transform:translateX(-5px) rotate(-1.5deg)}50%{transform:translateX(5px) rotate(1.5deg)}75%{transform:translateX(-3px)}}
.glass{aspect-ratio:340/215;border:4px solid var(--ink);border-bottom:0;border-radius:30px 30px 0 0;background:#dceef5;position:relative;overflow:hidden}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block}
.glass::after{content:"";position:absolute;left:16px;top:14px;width:14px;height:54px;border-radius:7px;background:rgba(255,255,255,.8);transform:rotate(18deg)}
.mbody{aspect-ratio:340/285;background:#f4f6f8;border:4px solid var(--ink);border-radius:0 0 22px 22px;position:relative;box-shadow:7px 7px 0 var(--ink)}
.bodysvg{position:absolute;inset:0;width:100%;height:100%}
.mcard{position:absolute;left:30.6%;top:8.4%;width:38.8%;height:26.4%;background:linear-gradient(160deg,#f4513a,#d92c1c);border:3.5px solid var(--ink);border-radius:12px;transform:rotate(-2deg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3%;pointer-events:none;z-index:2;box-shadow:0 3px 0 rgba(29,26,47,.25)}
.mcard .emblem{width:46%;aspect-ratio:1;background:#fff;border-radius:50%;display:grid;place-items:center}
.mcard .emblem svg{width:80%;height:80%;display:block}
.mcard .logo{font-family:var(--display);color:#fff;font-size:clamp(13px,5vw,20px);line-height:1.05;letter-spacing:.02em;white-space:nowrap;text-shadow:2px 0 0 var(--ink),-2px 0 0 var(--ink),0 2px 0 var(--ink),0 -2px 0 var(--ink),2px 2px 0 var(--ink)}
.handle{position:absolute;left:44.1%;top:63.6%;width:16.5%;aspect-ratio:1;translate:-50% -50%;background:none;border:0;touch-action:none;cursor:grab;padding:0;-webkit-tap-highlight-color:transparent;z-index:3}
.handle svg{width:100%;height:100%;display:block;filter:drop-shadow(0 3px 0 rgba(29,26,47,.3))}
.machine.ready .handle svg{filter:drop-shadow(0 0 7px rgba(245,179,1,.95))}
.slothit{position:absolute;left:70%;top:52.8%;width:13.5%;aspect-ratio:1;translate:-50% -50%;background:none;border:0;border-radius:50%;cursor:pointer;z-index:3;-webkit-tap-highlight-color:transparent}
.slothit.pulse{animation:slotp .45s ease-in-out 2}
@keyframes slotp{50%{box-shadow:0 0 0 7px rgba(245,179,1,.8)}}
.slotcoin{position:absolute;left:70%;top:17.2%;width:4.4%;height:10.5%;translate:-50% -50%;background:linear-gradient(90deg,#9aa3ad,#e8edf1,#9aa3ad);border:2px solid var(--ink);border-radius:3px;opacity:0;transition:opacity .2s;z-index:2}
.machine.hascoin .slotcoin{opacity:1}
.handle:focus-visible{outline:3px solid var(--shun);outline-offset:3px}
.retbtn{position:absolute;left:69.7%;top:68.4%;width:9.5%;aspect-ratio:1;translate:-50% -50%;border-radius:50%;border:3px solid var(--ink);background:radial-gradient(circle at 35% 30%,#f2f5f7,#aeb8c0);cursor:pointer;z-index:3;padding:0;-webkit-tap-highlight-color:transparent}
.retbtn::after{content:"";position:absolute;left:50%;top:50%;width:44%;height:9%;translate:-50% -50%;background:var(--ink);border-radius:3px}
.retbtn:active{scale:.92}
.cupcoin{position:absolute;left:69.7%;top:70.2%;width:12.5%;aspect-ratio:1;translate:-50% -50%;opacity:0;pointer-events:none;z-index:2;cursor:pointer;background:none;border:0;padding:0}
.cupcoin svg{width:100%;height:100%;display:block}
.cupcoin.on{opacity:1;pointer-events:auto}
.cupcoin.drop{animation:cupd .5s cubic-bezier(.2,.9,.3,1)}
@keyframes cupd{from{transform:translateY(-44px)}60%{transform:translateY(3px)}to{transform:none}}
.coinlayer{position:absolute;inset:0;pointer-events:none;z-index:4}
.roll{position:absolute;right:-54px;top:25%;width:47px;z-index:8}
.rcap{height:15px;background:#e8443a;border:3px solid #1d1a2f;border-radius:8px;margin:0 1px;position:relative;z-index:2}
.rbody{background:#fdfdff;border:3px solid #1d1a2f;border-radius:22px;margin-top:-8px;padding:12px 0 7px;box-shadow:2px 3px 0 rgba(29,26,47,.18)}
.rwin{margin:0 6px;background:linear-gradient(180deg,#dceef5,#c3dde9);border:2.5px solid #1d1a2f;border-radius:14px;height:172px;display:flex;flex-direction:column-reverse;align-items:center;justify-content:flex-start;gap:2px;padding:4px 0;overflow:hidden;box-shadow:inset 0 2px 5px rgba(29,26,47,.15)}
.rcoin{width:31px;height:31px;flex:0 0 auto;border:none;background:none;padding:0;border-radius:50%;cursor:pointer;touch-action:none;pointer-events:auto;-webkit-tap-highlight-color:transparent}
.rcoin svg{width:100%;height:100%;display:block;pointer-events:none}
.rcoin.drag{position:absolute;width:54px;height:54px;z-index:30;transform:translate(-50%,-50%);transition:none}
.rcoin.inserting{transition:left .18s ease-out,top .18s ease-out,transform .32s ease-in .08s,opacity .14s linear .3s;transform:translate(-50%,-34%) scaleX(.16) scaleY(.94);opacity:0;z-index:30}
.rbase{height:9px;background:#fdfdff;border:3px solid #1d1a2f;border-radius:6px;margin:-4px 3px 0;position:relative;z-index:2}
.stackcoin{position:absolute;left:84.4%;top:91%;width:13.5%;aspect-ratio:1;translate:-50% -50%;opacity:.85}
.stackcoin svg{width:100%;height:100%;display:block}
.fcoin{position:absolute;left:86.5%;top:92.5%;width:14.5%;aspect-ratio:1;translate:-50% -50%;background:none;border:0;padding:0;cursor:pointer;pointer-events:auto;-webkit-tap-highlight-color:transparent;perspective:320px}
.fcoin.drag{transition:none;z-index:6}
.fcoin.inserting{transition:left .3s,top .3s,opacity .3s,scale .3s;scale:.25;opacity:.15;z-index:6}
.fcoin .flip{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .45s cubic-bezier(.3,1.3,.5,1)}
.fcoin.flipped{z-index:7;translate:-98% -72%}
.fcoin.flipped .flip{transform:rotateY(180deg) scale(2.05)}
.fcoin .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.fcoin .face svg{width:100%;height:100%;display:block}
.fcoin .face.back{transform:rotateY(180deg)}
.fcoin .ctext{position:absolute;inset:16%;display:flex;align-items:center;justify-content:center;text-align:center;font-weight:700;color:#4a4232;line-height:1.45;word-break:break-all;overflow:hidden}
.chips{display:flex;gap:8px;align-items:center}
.chips:empty{display:none}
.chip{display:inline-flex;align-items:center;gap:5px;background:#fff;border:2.5px solid var(--ink);border-radius:999px;padding:1px 10px 1px 5px;font-family:var(--display);font-size:13px;box-shadow:2px 2px 0 var(--ink)}
.chip .ci{width:19px;height:19px;border-radius:50%;border:2px solid var(--ink);flex:none}
.chip .capic{background:linear-gradient(var(--me) 0 50%,#fffdf5 50% 100%)}
.chip .coinic{background:radial-gradient(circle at 35% 30%,#f2f5f7,#aeb8c0)}
.coinbig{display:none;width:86px;margin:0 auto}
.coinview{width:min(62vw,230px);aspect-ratio:1;position:relative;transform:scale(0) rotate(8deg);opacity:0;pointer-events:none;transition:transform .45s cubic-bezier(.25,1.5,.45,1),opacity .2s}
.coinview.on{transform:none;opacity:1;pointer-events:auto}
.coinview svg{width:100%;height:100%;display:block}
.coinview .flip{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .65s cubic-bezier(.3,1.35,.45,1)}
.coinview .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.coinview .face svg{width:100%;height:100%;display:block}
.coinview .face.back{transform:rotateY(180deg)}
.coinview.flipped .flip{transform:rotateY(180deg)}
.coinview .cvtext{font-family:'Yusei Magic','Zen Maru Gothic',sans-serif;position:absolute;inset:17%;display:flex;align-items:center;justify-content:center;text-align:center;font-weight:700;font-size:16.5px;line-height:1.6;color:#4a4232;word-break:break-all}
.memo.praise .coinbig{display:block}
.coinbig svg{width:100%;height:auto;display:block}
.cap.drop{animation:drop .75s cubic-bezier(.2,.9,.3,1) both,wob 2.4s 1s ease-in-out infinite}
.cap.into{animation:into .62s cubic-bezier(.5,0,.7,1) forwards;pointer-events:none}
@keyframes drop{from{transform:translate(-38px,116px) scale(.26)}60%{transform:translate(calc(var(--lx,0px)*.3),calc(var(--ly,0px)*.3 + 10px)) scale(1.07) rotate(var(--lr,0deg))}to{transform:translate(var(--lx,0px),var(--ly,0px)) rotate(var(--lr,0deg))}}
@keyframes into{from{transform:translateY(-70vh)}85%{opacity:1}to{transform:translateY(-150px) scale(.3);opacity:0}}
.card{height:min(100%,400px);aspect-ratio:3/4;max-width:100%;border:4px solid var(--ink);border-radius:24px;overflow:hidden;background:#17142a;box-shadow:7px 7px 0 var(--ink);position:relative;transform:scale(0) rotate(-8deg);opacity:0;pointer-events:none;transition:transform .5s cubic-bezier(.25,1.5,.45,1),opacity .2s}
.card.on{transform:none;opacity:1}
.card canvas,.card video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:none}
.card[data-show="sm"] #sm,.card[data-show="vd"] #vd{display:block}
.name{position:absolute;left:10px;top:10px;background:var(--from);color:#fff;border:3px solid var(--ink);border-radius:999px;padding:0 12px;font-family:var(--display);font-size:13px;line-height:1.9}

.bit{position:absolute;left:50%;top:50%;width:13px;height:13px;margin:-6px;border:2.5px solid var(--ink);border-radius:4px;pointer-events:none;animation:bit .8s cubic-bezier(.1,.7,.3,1) forwards}
@keyframes bit{from{transform:rotate(var(--a)) translateY(0) scale(1)}to{transform:rotate(var(--a)) translateY(calc(var(--d) * -1)) rotate(260deg) scale(.4);opacity:0}}
.bit.paper{border-radius:1px;animation-name:bitp;animation-duration:1.3s}
@keyframes bitp{from{transform:rotate(var(--a)) translateY(0) rotate(0)}to{transform:rotate(var(--a)) translateY(70px) rotate(200deg) scale(.85);opacity:0}}
.scene.glow{animation:glowf .65s ease-out}
@keyframes glowf{0%{filter:brightness(1)}30%{filter:brightness(1.18)}100%{filter:brightness(1)}}
.cap.shakeBig{animation:shakeBig .5s linear both}
.cap.shakeSoft{animation:shakeSoft .45s linear both}
@keyframes shakeBig{0%,100%{transform:translateX(0) rotate(0)}15%{transform:translateX(-13px) rotate(-11deg)}30%{transform:translateX(13px) rotate(11deg)}45%{transform:translateX(-11px) rotate(-9deg)}60%{transform:translateX(11px) rotate(9deg)}80%{transform:translateX(-5px) rotate(-4deg) scale(1.14)}}
@keyframes shakeSoft{0%,100%{transform:translateX(0) rotate(0)}25%{transform:translateX(-4px) rotate(-3deg)}50%{transform:translateX(4px) rotate(3deg)}75%{transform:translateX(-3px) rotate(-2deg)}}

.listbtn{font:inherit;font-size:13px;font-weight:700;color:var(--ink);background:var(--paper);border:2.5px solid var(--ink);border-radius:999px;padding:1px 6px 1px 12px;display:flex;align-items:center;gap:6px;cursor:pointer;box-shadow:2px 2px 0 var(--ink)}
.listbtn b{background:var(--red);color:#fff;border-radius:999px;min-width:22px;height:22px;display:grid;place-items:center;font-family:var(--display);font-weight:400;font-size:12px;font-variant-numeric:tabular-nums}
.listbtn.pop{animation:lpop .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes lpop{40%{transform:scale(1.25) rotate(-4deg)}}
.memo{width:min(76vw,290px);background:#fffbe0;border:4px solid var(--ink);border-radius:6px 6px 18px 6px;box-shadow:7px 7px 0 var(--ink);padding:26px 16px 12px;position:relative;display:flex;flex-direction:column;gap:6px;transform:scale(0) rotate(10deg);opacity:0;pointer-events:none;transition:transform .5s cubic-bezier(.25,1.5,.45,1),opacity .2s}
.memo.on{transform:rotate(-2deg);opacity:1;pointer-events:auto}
.memo.nudge{animation:shake .4s}
.tape{position:absolute;left:50%;top:-12px;width:84px;height:22px;margin-left:-42px;background:var(--from);border:3px solid var(--ink);transform:rotate(-3deg)}
.mby{font-size:12px;font-weight:700;color:var(--muted)}
.memo textarea{font:inherit;font-weight:700;font-size:20px;line-height:31px;color:var(--ink);background:repeating-linear-gradient(transparent 0 30px,rgba(29,26,47,.14) 30px 31px);border:0;outline:0;resize:none;width:100%;height:124px;padding:0;border-radius:0}
.memo textarea::placeholder{color:rgba(29,26,47,.35)}
.memo textarea:focus-visible{outline:3px solid var(--shun);outline-offset:4px}
.mn{align-self:flex-end;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.memo.read .mn{visibility:hidden}
.list{position:fixed;inset:0;display:none;z-index:15}
.list.on{display:block}
.shade{position:absolute;inset:0;background:rgba(29,26,47,.55)}
.panel{position:absolute;left:0;right:0;bottom:0;max-width:440px;margin:0 auto;max-height:78%;overflow:auto;background:var(--paper);border:4px solid var(--ink);border-bottom:0;border-radius:28px 28px 0 0;padding:18px 20px 26px}
.ph{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
h2{font-family:var(--display);font-weight:400;font-size:20px;margin:0}
.x{font:inherit;font-size:22px;line-height:1;width:38px;height:38px;border-radius:50%;border:3px solid var(--ink);background:#fff;cursor:pointer;color:var(--ink)}
#wl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
#wl li{display:grid;grid-template-columns:34px 1fr auto auto;gap:12px;align-items:center;border:3px solid var(--ink);border-radius:14px;padding:10px 12px;background:#fff}
#wl li.none{display:block;border-style:dashed;color:var(--muted);font-size:14px}
#wl b{display:block;font-size:16px;line-height:1.45}
#wl small{font-size:12px;color:var(--muted)}
.tick{width:34px;height:34px;border-radius:50%;border:3px solid var(--ink);background:#fff;cursor:pointer;padding:0;position:relative}
.wback{font:inherit;font-size:11.5px;font-weight:700;color:var(--muted);background:#fff;border:2px solid var(--ink);border-radius:999px;padding:5px 9px;cursor:pointer;white-space:nowrap;flex:none}
#wl li.done .tick{background:#34c38f}
#wl li.done .tick::after{content:"";position:absolute;left:10px;top:4px;width:8px;height:14px;border:solid var(--ink);border-width:0 3.5px 3.5px 0;transform:rotate(40deg)}
#wl li.done b{text-decoration:line-through;color:var(--muted)}
.shelf{display:flex;align-items:center;flex-wrap:wrap;gap:6px 8px;padding:0 2px 4px}
.shelf:empty{display:none}
.shelf .lab{font-size:12px;font-weight:700;color:var(--muted);flex:none}
.opened{flex:none;font:inherit;font-size:12px;font-weight:700;color:var(--ink);background:#fff;border:2.5px solid var(--ink);border-radius:999px;padding:3px 10px 3px 4px;display:flex;align-items:center;gap:6px;cursor:pointer;box-shadow:2px 2px 0 var(--ink)}
.opened i{width:24px;height:24px;border-radius:50%;border:2.5px solid var(--ink);background:linear-gradient(var(--c) 0 50%,#fffdf5 50% 100%)}
.opened.new{animation:lpop .5s cubic-bezier(.3,1.6,.5,1)}
.btn.ff{width:auto;flex:none;font-size:12px;padding:2px 4px;margin-left:auto}
.sheet{background:var(--paper);border:4px solid var(--ink);border-bottom:0;border-radius:28px 28px 0 0;padding:18px 20px 14px;display:flex;flex-direction:column;gap:12px}
.copy{min-height:30px;display:flex;flex-direction:column;gap:4px;justify-content:center}
.k{margin:0;font-size:13px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
h1{font-family:var(--display);font-weight:400;font-size:23px;line-height:1.4;margin:0;text-wrap:balance}
h1 em{font-style:normal;color:var(--from)}
p{margin:0}
.soft{font-size:14.5px;color:var(--muted);text-wrap:pretty}
.warn{font-size:14px;font-weight:700;color:var(--red)}
.time{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.count{font-family:var(--display);font-size:34px;line-height:1.2;font-variant-numeric:tabular-nums}
.meter{height:16px;border:3px solid var(--ink);border-radius:999px;background:#fff;overflow:hidden}
.meter i{display:block;height:100%;width:0;background:var(--from)}

.acts{min-height:118px;display:flex;flex-direction:column;gap:10px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{font:inherit;font-family:var(--display);font-size:18px;color:#fff;background:var(--red);border:3.5px solid var(--ink);border-radius:16px;padding:10px 14px;text-align:center;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;width:100%;position:relative;box-shadow:4px 4px 0 var(--ink);transition:transform .08s,box-shadow .08s;-webkit-tap-highlight-color:transparent}
.btn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
.btn.sub{background:#fff;color:var(--ink);font-size:15px;padding:9px 10px}
.btn.plain{background:transparent;color:var(--muted);border-color:transparent;box-shadow:none;font-family:var(--body);font-weight:700;font-size:14px;padding:4px;text-decoration:underline;text-underline-offset:3px}
.btn:focus-visible,label.btn:focus-within{outline:3px solid var(--shun);outline-offset:2px}
label.btn input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.dial{width:26px;height:26px;border-radius:50%;background:#fff;border:3px solid var(--ink);position:relative;flex:none}
.dial::after{content:"";position:absolute;left:50%;top:50%;width:20px;height:6px;margin:-3px -10px;background:var(--ink);border-radius:3px}
.btn.spin .dial{animation:spin .6s cubic-bezier(.4,0,.2,1)}
@keyframes spin{to{transform:rotate(360deg)}}
.foot{font-size:11.5px;color:var(--muted);text-align:center;line-height:1.5}
@media (max-height:700px){.machine{width:208px}}
@media (max-height:660px){h1{font-size:20px} .cap{transform-origin:center} .count{font-size:28px}}
.wctl{display:flex;flex-direction:column;gap:4px}
.wctl button{font:inherit;font-size:13px;line-height:1;width:30px;height:26px;border:2.5px solid var(--ink);border-radius:8px;background:#fff;cursor:pointer;color:var(--ink);padding:0}
.authwrap{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:rgba(29,26,47,.45);padding:18px}
.authwrap[hidden]{display:none}
.authcard{background:var(--paper);border:4px solid var(--ink);border-radius:24px;box-shadow:7px 7px 0 var(--ink);padding:22px 20px;max-width:360px;width:100%;display:flex;flex-direction:column;gap:12px}
.authcard h2{font-size:22px}
.authcard input{font:inherit;font-size:16px;padding:10px 12px;border:3px solid var(--ink);border-radius:12px;background:#fff;color:var(--ink)}
.asoft{font-size:14px;color:var(--muted)}
.footbtn{font:inherit;font-size:11.5px;color:var(--muted);background:none;border:0;text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:0}
@media (prefers-reduced-motion:reduce){.cap.arrive,.cap.drop,.cap.into,.machine.jig,.cap.shake,.cap.shakeBig,.cap.shakeSoft,.cap.roll,.cap.pop,.bit,.scene.glow,.btn.spin .dial{animation:none}.cap.roll,.cap.into{opacity:0}.card,.cap span{transition:opacity .2s}}

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
window.__startGacha=function(){
  var $=function(id){return document.getElementById(id);};
  var phone=$('phone'), scene=$('scene'), cap=$('cap'), card=$('card'), sm=$('sm'), v=$('vd'), copy=$('copy'), acts=$('acts'),
      machine=$('machine'), handle=$('handle'), glass=$('glass'), memo=$('memo'), shelfEl=$('shelf'), gl=$('gl');
  var P={shun:{name:'しゅんや',ini:'し',col:'#2f7bff'},ari:{name:'ありさ',ini:'あ',col:'#ff5c8a'}};
  var DAY=24*3600*1000, SDUR=12;

  /* =====================================================================
     Store：データの出し入れは、すべてここを通る。
     いまは 1台の中だけで動く見本用（LocalStore）。
     二人で使う版は、同じ名前・同じ戻り値の SupabaseStore に差し替える。
     どの関数も Promise を返す。くわしい約束は HANDOFF.md。
     ===================================================================== */
  var Store=(function(){
    var sb=window.__sb, slot=window.__slot, pair=window.__pair;
    function rpc(name,args){ return sb.rpc(name,args||{}).then(function(r){ if(r.error) throw r.error; return r.data; }); }
    function sign(path){ return sb.storage.from('gacha-videos').createSignedUrl(path,3600).then(function(r){ return (r.data&&r.data.signedUrl)||''; }); }
    function notifyPartner(){ try{ var p=sb.functions.invoke('gacha-notify',{body:{kind:'capsule'}}); if(p&&p.catch) p.catch(function(){}); }catch(e){} }
    return {
      demo:false,
      me:function(){ return slot; },
      capsules:function(){ return rpc('gacha_capsules').then(function(rows){ return (rows||[]).map(function(r){ return {id:r.id, by:r.by_slot, kind:r.kind}; }); }); },
      add:function(by,c){
        if(c.kind==='memo'){ return rpc('gacha_add_memo',{p_text:c.text}).then(function(id){ notifyPartner(); return {id:id, by:slot, kind:'memo'}; }); }
        if(c.kind==='file'){
          var ext='mp4'; if(c.blob&&c.blob.name){ var p=c.blob.name.split('.').pop(); if(p&&p.length<=5) ext=p; }
          var path=pair+'/'+crypto.randomUUID()+'.'+ext;
          var up=function(force){ return sb.storage.from('gacha-videos').upload(path,c.blob,{contentType:(c.blob&&c.blob.type)||'video/mp4',upsert:!!force}).then(function(r){ if(r.error) throw r.error; }); };
          return up(false).catch(function(){ return new Promise(function(res){ setTimeout(res,1500); }).then(function(){ return up(true); }); })
            .then(function(){ return rpc('gacha_add_file',{p_path:path,p_dur:(isFinite(c.dur)?c.dur:null)}); })
            .then(function(id){ notifyPartner(); return {id:id, by:slot, kind:'file'}; });
        }
        return Promise.reject(new Error('unsupported kind'));
      },
      take:function(viewer){
        return rpc('gacha_take').then(function(r){
          if(!r) return null;
          if(r.kind==='memo') return {id:r.id, by:r.by_slot, kind:'memo', text:r.text};
          return sign(r.video_path).then(function(url){ return {id:r.id, by:r.by_slot, kind:'file', url:url, dur:r.dur, at:new Date(r.opened_at).getTime()}; });
        });
      },
      spin:function(viewer,coinId){
        return rpc('gacha_spin',{p_coin:coinId}).then(function(r){
          if(!r) return null;
          if(r.kind==='memo') return {id:r.id, by:r.by_slot, kind:'memo', text:r.text};
          return sign(r.video_path).then(function(url){ return {id:r.id, by:r.by_slot, kind:'file', url:url, dur:r.dur, at:new Date(r.opened_at).getTime()}; });
        });
      },
      myCoins:function(){ return rpc('gacha_my_coins').then(function(rows){ return (rows||[]).map(function(r){ return {id:r.id, text:r.txt, kind:r.kind, at:new Date(r.at).getTime()}; }); }); },
      giveCoin:function(viewer,text){
        return rpc('gacha_give_coin',{p_text:text}).then(function(id){
          try{ var p=sb.functions.invoke('gacha-notify',{body:{type:'coin'}}); if(p&&p.catch) p.catch(function(){}); }catch(e){}
          return {id:id};
        });
      },
      rescue:function(){ return rpc('gacha_rescue'); },
      counts:function(){ return rpc('gacha_counts').then(function(r){ return r||{mine:0,given:0,held:0}; }); },
      shelf:function(viewer){
        return rpc('gacha_shelf').then(function(rows){
          return Promise.all((rows||[]).map(function(r){ return sign(r.video_path).then(function(url){ return {id:r.id, by:r.by_slot, kind:'file', url:url, dur:r.dur, at:new Date(r.opened_at).getTime()}; }); }));
        });
      },
      wishes:function(){ return rpc('gacha_wishes').then(function(rows){ return (rows||[]).map(function(r){ return {id:r.id, t:r.t, by:r.by_slot, done:!!r.done}; }); }); },
      toggleWish:function(id){ return rpc('gacha_toggle_wish',{p_id:id}); },
      deleteWish:function(id){ return rpc('gacha_delete_wish',{p_id:id}); },
      moveWish:function(id,dir){ return rpc('gacha_move_wish',{p_id:id,p_dir:dir}); },
      recapsule:function(viewer,id){ return rpc('gacha_recapsule',{p_wish_id:id}).then(function(r){ if(r) notifyPartner(); return r; }); },
      fastForward:function(){ return Promise.resolve(); },
      onChange:function(cb){}
    };
  })();
  /* ===== Store ここまで ===== */

  var st={me:Store.me(),mode:'home',cur:null,replay:false,draft:null,note:'',warn:'',raf:0,t:0,paused:false,last:0,turn:0,q:0,spin:false,coins:[],given:0,mine:0,insertedId:null,cupCoinId:null};
  /* 画面が持っている写し。sync() で Store から取り直す */
  var box=[], shelf={shun:[],ari:[]}, wishes=[];
  function sync(){ return Promise.all([Store.capsules(),Store.shelf(st.me),Store.wishes(),Store.myCoins(st.me),Store.counts(st.me)]).then(function(r){ box=r[0]; shelf[st.me]=r[1]; wishes=r[2]; st.coins=r[3]||[]; var ct=r[4]||{}; st.given=ct.given||0; st.mine=ct.mine||0; badge(); if(st.insertedId && !st.coins.some(function(c){ return String(c.id)===String(st.insertedId); })) st.insertedId=null; }); }
  function refresh(){ sync().then(function(){ if(st.mode==='home') home(true); }).catch(function(){}); }
  var calm=window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  function ms(n){return calm?Math.min(n,120):n;}
  function other(k){return k==='shun'?'ari':'shun';}
  function fmt(s){s=Math.max(0,Math.ceil(s));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');}
  function dateLine(){var d=new Date();return (d.getMonth()+1)+'月'+d.getDate()+'日（'+'日月火水木金土'.charAt(d.getDay())+'）';}
  function capSet(c){cap.className='cap '+c;}
  function esc(t){ return String(t).replace(/[&<>"]/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  function pick(text,cls){return '<label class="btn '+cls+'">'+text+'<input type="file" class="pick" accept="video/*"></label>';}
  function isFile(){return st.cur && st.cur.kind==='file';}
  function stopV(){ try{ v.pause(); v.removeAttribute('src'); v.load(); }catch(e){} }

  /* やりたいことリスト */
  function badge(){ $('cnt').textContent=wishes.filter(function(w){ return !w.done; }).length; }
  function renderList(){
    $('wl').innerHTML = wishes.length ? wishes.map(function(w,i){
      return '<li class="'+(w.done?'done':'')+'"><button class="tick" data-act="tick" data-id="'+esc(w.id)+'" aria-label="'+(w.done?'やった、を取り消す':'やった、にする')+'"></button><span><b>'+esc(w.t)+'</b><small>'+(P[w.by]?P[w.by].name:'')+'のメモ</small></span><button class="wback" data-act="recap" data-id="'+esc(w.id)+'">カプセルに戻す</button><span class="wctl"><button data-act="up" data-id="'+esc(w.id)+'" aria-label="上へ">↑</button><button data-act="down" data-id="'+esc(w.id)+'" aria-label="下へ">↓</button><button data-act="delwish" data-id="'+esc(w.id)+'" aria-label="消す">×</button></span></li>';
    }).join('') : '<li class="none">まだありません。メモのカプセルを開けると、ここに並びます。</li>';
  }

  /* ガチャ台の中の球 */
  var sim={balls:[],W:0,H:0,prev:0,last:0,pull:0,d:1};
  var MEMO_COLS=['#f2b134','#7bc96f','#ff8a5c','#9b7bea','#2ec4b6'];
  function memoIdx(id){ var h=0, s=String(id); for(var i=0;i<s.length;i++){ h=(h*31+s.charCodeAt(i))|0; } return Math.abs(h)%5; }
  function tgt(){ var o=other(st.me); for(var i=0;i<box.length;i++){ if(box[i].by===o && box[i].kind!=='memo') return box[i].id; } for(var j=0;j<box.length;j++){ if(box[j].kind==='memo') return -1; } return 0; }
  function simFlags(){ var t=tgt(); sim.balls.forEach(function(b){ b.star=!!b.id && b.id===t; }); }
  function simSize(){ var d=Math.min(window.devicePixelRatio||1,2); sim.W=glass.clientWidth; sim.H=glass.clientHeight; gl.width=Math.round(sim.W*d); gl.height=Math.round(sim.H*d); sim.d=d; }
  function simSync(){
    simSize(); sim.balls=[]; var W=sim.W,H=sim.H,r=W*0.08,i;
    for(i=0;i<4;i++) sim.balls.push({x:r+6+i*((W-2*r-12)/3),y:H-r,vx:0,vy:0,a:i*1.7,r:r,c:'rgba(255,255,255,.6)',deco:true});
    box.slice(0,9).forEach(function(c,k){ sim.balls.push({id:c.id,x:W*0.2+((k*0.37)%1)*W*0.6,y:H*0.45-k*6,vx:0,vy:0,a:k,r:(c.kind!=='memo'?W*0.12:W*0.105),vid:c.kind!=='memo',c:(c.kind==='memo'?MEMO_COLS[memoIdx(c.id)]:P[c.by].col)}); });
    simFlags(); for(i=0;i<150;i++) simStep(1/60,0,0);
  }
  function simMerge(){
    var ids={}, have={}; box.forEach(function(c){ ids[c.id]=1; });
    sim.balls=sim.balls.filter(function(b){ return b.deco || b.exit || ids[b.id]; });
    sim.balls.forEach(function(b){ if(b.id) have[b.id]=1; });
    box.forEach(function(c){ if(!have[c.id]) addBall(c); });
    simFlags();
  }
  function addBall(c){ sim.balls.push({id:c.id,x:sim.W/2+6,y:-34,vx:20,vy:420,a:0,r:(c.kind!=='memo'?sim.W*0.12:sim.W*0.105),vid:c.kind!=='memo',c:(c.kind==='memo'?MEMO_COLS[memoIdx(c.id)]:P[c.by].col)}); simFlags(); }
  function simStep(dt,om,pull){
    var W=sim.W,H=sim.H,B=sim.balls,i,j,b; sim.pull=pull;
    for(i=0;i<B.length;i++){
      b=B[i];
      if(b.exit){ b.vy+=1500*dt; b.y+=b.vy*dt; b.x+=(W/2-b.x)*0.2; continue; }
      var ax=0, ay=1400;
      if(om>0){
        var dx=b.x-W/2, dy=b.y-H, dist=Math.sqrt(dx*dx+dy*dy)||1, f=Math.max(0,1-dist/(W*0.8));
        ax+=-dy/dist*3.2*om*f; ay+=dx/dist*3.2*om*f;
        if(b.y>H-b.r*1.7) ay-=2.6*om;
      }
      if(b.star && pull>0){ ax+=(W/2-b.x)*pull; ay+=(H-b.r-b.y)*pull; b.vx*=0.9; b.vy*=0.9; }
      else if(pull>0 && b.y>H*0.3){ var sx=b.x-W/2; if(Math.abs(sx)<W*0.3) ax+=(sx>=0?1:-1)*pull*55; }

    else if(a==='keep') keep();
    else if(a==='closeCoin'){ if(st.mode==='coinview'){ coinviewEl.className='coinview'; home(); } }
    else if(a==='praise') praise();
    else if(a==='praiseSend') praiseSend();
    else if(a==='cancelPraise'){ if(st.mode==='praise'){ memo.className='memo'; home(); } }
    else if(a==='compose') compose();
    else if(a==='write') write();
    else if(a==='sample') send(true);
    else if(a==='send') send(false);
    else if(a==='cancel'){ if(st.mode==='compose'||st.mode==='write'||st.mode==='ready'){ var away=machine.classList.contains('away'); dropDraft(); stopV(); home(!away); } }
    else if(a==='switch'){ if(st.mode==='home' && Store.demo){ st.me=other(st.me); sync().then(function(){ home(); }); } }
    else if(a==='replay') replay(b.getAttribute('data-id'));
    else if(a==='ff'){ if(st.mode==='home'){ Store.fastForward(st.me).then(sync).then(function(){
      var s=copy.querySelector('.soft,.warn'); if(s){ s.className='soft'; s.textContent='24時間たって、あけた動画が消えました。'; } renderShelf(); }); } }
    else if(a==='list'){ renderList(); $('list').classList.add('on'); }
    else if(a==='closelist'){ $('list').classList.remove('on'); }
    else if(a==='recap'){ Store.recapsule(st.me,b.getAttribute('data-id')).then(sync).then(function(){ $('list').classList.remove('on'); home(); }); }
    else if(a==='tick'){ Store.toggleWish(b.getAttribute('data-id')).then(sync).then(renderList); }
    else if(a==='up'){ Store.moveWish(b.getAttribute('data-id'),-1).then(sync).then(renderList); }
    else if(a==='down'){ Store.moveWish(b.getAttribute('data-id'),1).then(sync).then(renderList); }
    else if(a==='delwish'){ Store.deleteWish(b.getAttribute('data-id')).then(sync).then(renderList); }
  });
  $('memoText').addEventListener('input',function(){ $('memoN').textContent=this.value.length+'/60'; });
  document.addEventListener('change',function(e){
    if(!e.target.classList || !e.target.classList.contains('pick')) return;
    if(st.mode!=='compose' && st.mode!=='ready') return;
    var f=e.target.files&&e.target.files[0]; if(!f) return;
    stopV(); dropDraft();
    var url=URL.createObjectURL(f); var draft={kind:'file',url:url,dur:NaN,blob:f}; st.draft=draft;
    var probe=document.createElement('video'); probe.muted=true; probe.playsInline=true; probe.preload='auto';
    probe.style.cssText='position:absolute;left:0;top:0;width:1px;height:1px;opacity:0;pointer-events:none';
    document.body.appendChild(probe);
    var probeFin=false;
    function probeDone(){ if(probeFin) return; probeFin=true; try{ probe.remove(); }catch(e){} if(st.draft===draft) ready(); }
    probe.onloadedmetadata=function(){
      var d=probe.duration;
      if(isFinite(d)&&d>0){ draft.dur=d; probeDone(); }
      else { try{ probe.currentTime=1e7; }catch(e){} setTimeout(probeDone,1200); }
    };
    probe.ondurationchange=function(){ var d=probe.duration; if(isFinite(d)&&d>0){ draft.dur=d; probeDone(); } };
    probe.onerror=function(){ probeDone(); };
    setTimeout(probeDone,3000);
    probe.src=url;
  });

  /* コイン：足元のコイン、投入、裏返し、返却口 */
  var chipsEl=$('chips'), coinLayer=$('coinLayer'), slotHit=$('slotHit'), retBtn=$('retBtn'), cupCoin=$('cupCoin'), coinviewEl=$('coinview');
  function coinFace(){
    return '<svg viewBox="0 0 48 48"><defs><radialGradient id="cgf" cx="0.38" cy="0.32" r="0.9"><stop offset="0" stop-color="#f4f7f9"/><stop offset=".6" stop-color="#ccd4db"/><stop offset="1" stop-color="#9aa7b1"/></radialGradient></defs><circle cx="24" cy="24" r="21" fill="url(#cgf)" stroke="#1d1a2f" stroke-width="2.5"/><circle cx="24" cy="24" r="16.5" fill="none" stroke="rgba(29,26,47,.35)" stroke-width="1.6"/><circle cx="24" cy="24" r="12" fill="#fffdf5"/><path d="M12 24a12 12 0 0 1 24 0z" fill="#ff5c8a"/><circle cx="24" cy="24" r="12" fill="none" stroke="#1d1a2f" stroke-width="2"/><path d="M12 24h24" stroke="#1d1a2f" stroke-width="2"/><ellipse cx="19" cy="17.5" rx="3.2" ry="1.7" fill="rgba(255,255,255,.85)" transform="rotate(-24 19 17.5)"/></svg>';
  }
  function coinBack(){
    return '<svg viewBox="0 0 48 48"><circle cx="24" cy="24" r="21" fill="url(#cgf)" stroke="#1d1a2f" stroke-width="2.5"/><circle cx="24" cy="24" r="16.5" fill="none" stroke="rgba(29,26,47,.35)" stroke-width="1.6"/><circle cx="24" cy="24" r="12.5" fill="none" stroke="rgba(29,26,47,.18)" stroke-width="1.2"/></svg>';
  }
  function sayWarn(msg){ var w=copy.querySelector('.warn'); if(!w){ copy.innerHTML='<p class="warn"></p>'; w=copy.querySelector('.warn'); } if(w) w.textContent=msg; }
  function renderChips(){
    chipsEl.innerHTML='<span class="chip"><i class="ci capic"></i>'+st.mine+'</span><span class="chip"><i class="ci coinic"></i>'+st.given+'</span>';
  }
  function footCoin(){
    for(var i=0;i<st.coins.length;i++){ var c=st.coins[i];
      if(String(c.id)!==String(st.insertedId) && String(c.id)!==String(st.cupCoinId)) return c; }
    return null;
  }
  function renderCoins(){
    coinLayer.querySelectorAll('.rcoin').forEach(function(n){ n.remove(); });
    machine.classList.toggle('hascoin', !!st.insertedId);
    machine.classList.toggle('ready', !!st.insertedId);
    var rest=st.coins.filter(function(c){ return String(c.id)!==String(st.insertedId) && String(c.id)!==String(st.cupCoinId); });
    var h='';
    if(rest.length){ h='<div class="roll"><div class="rcap"></div><div class="rbody"><div class="rwin">'+rest.slice(0,7).map(function(c){ return '<button class="rcoin" data-cid="'+esc(c.id)+'" aria-label="コイン">'+coinFace()+'</button>'; }).join('')+'</div></div><div class="rbase"></div></div>'; }
    $('rollSlot').innerHTML=h;
  }
  function renderCup(pop){ cupCoin.className='cupcoin'+(st.cupCoinId?' on':'')+(pop?' drop':''); }
  function claimCup(){ if(!st.cupCoinId) return; st.cupCoinId=null; renderCup(false); renderCoins(); jig(); }
  var cdrag=null;
  $('rollSlot').addEventListener('pointerdown',function(e){
    var rc=e.target.closest('.rcoin'); if(!rc||st.mode!=='home') return;
    var lr=coinLayer.getBoundingClientRect(), r=rc.getBoundingClientRect();
    cdrag={el:rc,cid:rc.getAttribute('data-cid'),x:e.clientX,y:e.clientY,moved:0,lr:lr,cx:r.left+r.width/2-lr.left,cy:r.top+r.height/2-lr.top};
    try{ rc.setPointerCapture(e.pointerId); }catch(x){}
    e.preventDefault();
  });
  document.addEventListener('pointermove',function(e){
    if(!cdrag) return;
    var dx=e.clientX-cdrag.x, dy=e.clientY-cdrag.y;
    cdrag.moved=Math.max(cdrag.moved,Math.abs(dx)+Math.abs(dy));
    if(cdrag.moved>8){
      var bottom=footCoin();
      if(!bottom || String(bottom.id)!==String(cdrag.cid)){ cdrag=null; return; }
      if(!cdrag.el.classList.contains('drag')){ cdrag.el.classList.add('drag'); coinLayer.appendChild(cdrag.el); cdrag.el.style.left=cdrag.cx+'px'; cdrag.el.style.top=cdrag.cy+'px'; }
      cdrag.el.style.left=(cdrag.cx+dx)+'px'; cdrag.el.style.top=(cdrag.cy+dy)+'px';
    }
  });
  function coinUp(){
    if(!cdrag) return;
    var el=cdrag.el, mv=cdrag.moved, lr=cdrag.lr, cid=cdrag.cid;
    var px=parseFloat(el.style.left), py=parseFloat(el.style.top);
    if(isNaN(px)) px=cdrag.cx; if(isNaN(py)) py=cdrag.cy;
    cdrag=null;
    if(mv<=8){ var cn=null; st.coins.forEach(function(c){ if(String(c.id)===String(cid)) cn=c; }); if(cn) showCoin(cn); return; }
    if(!el.classList.contains('drag')) return;
    var sx=lr.width*0.70, sy=lr.height*0.528, d=Math.sqrt((px-sx)*(px-sx)+(py-sy)*(py-sy));
    if(d<58) insertCoin(cid, el); else renderCoins();
  }
  document.addEventListener('pointerup',coinUp);
  document.addEventListener('pointercancel',coinUp);
  function insertCoin(cid, el){
    if(st.insertedId){ sayWarn('コインはもう入ってる'); renderCoins(); return; }
    var coin=null; st.coins.forEach(function(c){ if(String(c.id)===String(cid)) coin=c; }); if(!coin) return;
    var lr=coinLayer.getBoundingClientRect();
    el.classList.add('inserting');
    el.style.left=(lr.width*0.70)+'px'; el.style.top=(lr.height*0.528)+'px';
    setTimeout(function(){ el.remove(); st.insertedId=coin.id; renderCoins(); jig(); },450);
  }
  slotHit.addEventListener('click',function(){
    if(st.mode!=='home') return;
    if(st.insertedId){ st.insertedId=null; renderCoins(); return; }
    var fc=$('footCoin');
    if(fc) insertCoin(fc);
    else { slotHit.classList.remove('pulse'); void slotHit.offsetWidth; slotHit.classList.add('pulse'); }
  });
  retBtn.addEventListener('click',function(){
    if(st.mode!=='home') return;
    if(st.cupCoinId){ claimCup(); return; }
    if(footCoin()||st.insertedId){ jig(); return; }
    Store.rescue(st.me).then(function(r){
      if(r&&r.ok){ st.cupCoinId=r.id; sync().then(function(){ renderCoins(); renderCup(true); }); }
      else jig();
    }).catch(function(){ jig(); });
  });
  cupCoin.addEventListener('click',function(){ if(st.mode==='home'&&st.cupCoinId) claimCup(); });

  function showCoin(coin){
    if(st.mode!=='home') return; st.mode='coinview'; chipsEl.innerHTML='';
    var t=coin.text||'';
    var fs=t.length<=14?'21px':(t.length<=30?'18px':'15.5px');
    $('cvFront').innerHTML=coinFace();
    $('cvBack').innerHTML=coinBack()+(t?'<span class="cvtext" style="font-size:'+fs+'">'+esc(t)+'</span>':'');
    coinviewEl.className='coinview on'; machine.classList.add('away');
    copy.innerHTML=''; acts.innerHTML='<button class="btn" data-act="closeCoin">とじる</button>';
  }
  coinviewEl.addEventListener('click',function(){ if(st.mode==='coinview') coinviewEl.classList.toggle('flipped'); });

  /* いいところを書いてコインを渡す */
  function praise(){
    if(st.mode!=='home') return; st.mode='praise'; chipsEl.innerHTML='';
    phone.setAttribute('data-from',st.me); machine.classList.add('away');
    var t=$('memoText'); t.readOnly=false; t.value=''; t.placeholder='例：笑った顔が好き';
    $('memoBy').textContent=P[other(st.me)].name+'のいいところ'; $('memoN').textContent='0/60';
    memo.className='memo on praise';
    copy.innerHTML='';
    acts.innerHTML='<button class="btn" data-act="praiseSend">コインを渡す</button><button class="btn plain" data-act="cancelPraise">やめる</button>';
  }
  function praiseSend(){
    if(st.mode!=='praise') return;
    var t=$('memoText').value.replace(/\s+/g,' ').trim();
    if(!t){ memo.classList.remove('nudge'); void memo.offsetWidth; memo.classList.add('nudge'); return; }
    st.mode='sending'; acts.innerHTML=''; memo.className='memo';
    Store.giveCoin(st.me,t).then(function(){
      st.given++; st.note='コインを渡しました。'; home();
    }).catch(function(){ st.warn='渡せませんでした。もう一度ためしてください。'; home(); });
  }

  /* ハンドルを指でまわす（右回りだけ） */
  var drag=null;
  function ang(e){ return Math.atan2(e.clientY-drag.cy,e.clientX-drag.cx)*180/Math.PI; }
  handle.addEventListener('pointerdown',function(e){
    if(st.mode!=='home'||st.spin) return;
    try{ handle.setPointerCapture(e.pointerId); }catch(x){}
    var r=handle.getBoundingClientRect(); drag={cx:r.left+r.width/2,cy:r.top+r.height/2,moved:0}; drag.a=ang(e); e.preventDefault();
  });
  handle.addEventListener('pointermove',function(e){
    if(!drag) return;
    var a=ang(e), d=a-drag.a; if(d>180) d-=360; if(d<-180) d+=360;
    drag.a=a; drag.moved+=Math.abs(d); if(d<=0) return;
    st.turn+=d; setRot();
    if(st.turn>=360){ drag=null; st.skipClick=true; complete(); }
  });
  function up(){ if(!drag) return; var m=drag.moved; drag=null; st.skipClick=true; if(m<12) autoSpin(); }
  handle.addEventListener('pointerup',up); handle.addEventListener('pointercancel',up);
  handle.addEventListener('click',function(){ if(st.skipClick){ st.skipClick=false; return; } autoSpin(); });

  Store.onChange(function(){ if(st.mode==='home') refresh(); });
  sync().then(function(){ home(); });
  requestAnimationFrame(simLoop);
};
</script>
<div id="auth" class="authwrap" hidden>
  <form id="authForm" class="authcard">
    <h2>1分動画ガチャ</h2>
    <p class="asoft">ふたり専用。ログインしてね。</p>
    <input id="authEmail" type="email" placeholder="メールアドレス" autocomplete="username" required>
    <input id="authPass" type="password" placeholder="パスワード" autocomplete="current-password" required>
    <button class="btn" type="submit">ログイン</button>
    <p class="warn" id="authErr"></p>
  </form>
</div>
<script>
(function(){
  var CFG=window.GACHA_CONFIG;
  var sb=window.supabase.createClient(CFG.SUPABASE_URL, CFG.SUPABASE_ANON_KEY);
  window.__sb=sb;
  var authEl=document.getElementById('auth'), errEl=document.getElementById('authErr');
  function showAuth(msg){ authEl.hidden=false; if(msg) errEl.textContent=msg; }
  function urlB64ToUint8(b64){ var pad='='.repeat((4-b64.length%4)%4); var s=(b64+pad).replace(/-/g,'+').replace(/_/g,'/'); var raw=atob(s); var arr=new Uint8Array(raw.length); for(var i=0;i<raw.length;i++) arr[i]=raw.charCodeAt(i); return arr; }
  function saveSub(sub){ var j=sub.toJSON(); if(!j||!j.keys) return Promise.resolve(); return sb.from('push_subscriptions').upsert({user_id:window.__uid, endpoint:j.endpoint, p256dh:j.keys.p256dh, auth:j.keys.auth},{onConflict:'endpoint'}); }
  function subscribePush(){ if(!('serviceWorker' in navigator)||!('PushManager' in window)) return Promise.resolve(false);
    return navigator.serviceWorker.ready.then(function(reg){ return reg.pushManager.getSubscription().then(function(sub){ if(sub) return sub; return reg.pushManager.subscribe({userVisibleOnly:true, applicationServerKey:urlB64ToUint8(CFG.VAPID_PUBLIC_KEY)}); }); }).then(function(sub){ return saveSub(sub); }).then(function(){ return true; }).catch(function(){ return false; }); }
  function refreshPushBtn(){ var b=document.getElementById('pushBtn'); if(!b) return; if(!('PushManager' in window)){ b.textContent='通知はこの端末では使えません'; return; } b.textContent=(window.Notification&&Notification.permission==='granted')?'通知オン':'通知をオンにする'; }
  function setupFoot(){ var foot=document.getElementById('foot'); if(!foot) return;
    foot.innerHTML='<button class="footbtn" id="pushBtn" type="button">通知をオンにする</button> · <button class="footbtn" id="logoutBtn" type="button">ログアウト</button>';
    document.getElementById('pushBtn').addEventListener('click',function(){ if(window.Notification&&Notification.permission==='granted'){ subscribePush().then(refreshPushBtn); return; } if(window.Notification){ Notification.requestPermission().then(function(p){ if(p==='granted') subscribePush().then(refreshPushBtn); refreshPushBtn(); }); } });
    document.getElementById('logoutBtn').addEventListener('click',function(){ sb.auth.signOut().then(function(){ location.reload(); }); });
    refreshPushBtn();
    if(window.Notification&&Notification.permission==='granted') subscribePush();
  }
  function enter(session){
    window.__uid=session.user.id;
    return sb.from('members').select('slot,pair_id').eq('user_id',session.user.id).single().then(function(r){
      if(r.error||!r.data){ showAuth('ペア登録がまだです。モコに伝えてね。'); return; }
      window.__slot=r.data.slot; window.__pair=r.data.pair_id;
      authEl.hidden=true;
      if('serviceWorker' in navigator){ navigator.serviceWorker.register('sw.js').catch(function(){}); }
      window.__startGacha();
      setupFoot();
    });
  }
  document.getElementById('authForm').addEventListener('submit',function(e){ e.preventDefault(); errEl.textContent='';
    var email=document.getElementById('authEmail').value.trim(), pass=document.getElementById('authPass').value;
    sb.auth.signInWithPassword({email:email,password:pass}).then(function(r){ if(r.error){ errEl.textContent='ログインできませんでした。メールとパスワードを確認してね。'; return; } enter(r.data.session); });
  });
  sb.auth.getSession().then(function(r){ var s=r.data&&r.data.session; if(s) enter(s); else showAuth(); });
})();
</script>
</body>
